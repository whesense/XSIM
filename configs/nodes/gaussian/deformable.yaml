# Deformable objects gaussian node (node-kind aspect only).
# Compose with a feature (features/*.yaml) and a strategy (strategy/*.yaml).
_fn_: xsim.modeling.nodes.gaussian.deformable_node.DeformableSceneNode.create
return_velocity: true
deformable_cfg:
  embed_dim: 16
  deform_scale: false
model_type:
  _fn_: xsim.modeling.gaussian.compose
  mixins:
    - _type_: xsim.modeling.gaussian.Instanced
opt_cfg:
  _import_: ../common/opt/deformable.yaml
