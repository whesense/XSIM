# container_raw_lidar_density.yaml variant that additionally composes the
# SkyLogit mixin: every particle carries a per-particle sky probability
# (sigmoid-activated) alongside the lidar density.
_fn_: xsim.modeling.nodes.gaussian.GaussianContainer.create
nodes:
  - _import_:
      - ./static.yaml
      - ./features/raw.yaml
      - ./mixins/lidar_density.yaml
      - ./mixins/sky_logit.yaml
      - ./regularization/sharp_shape.yaml
      - ./regularization/lidar_density.yaml
      - ./strategy/eval3d_static.yaml
  - _import_:
      - ./rigid.yaml
      - ./features/raw.yaml
      - ./mixins/lidar_density.yaml
      - ./mixins/sky_logit.yaml
      - ./regularization/sharp_shape.yaml
      - ./regularization/lidar_density.yaml
      - ./strategy/eval3d_rigid.yaml
  - _import_:
      - ./deformable.yaml
      - ./features/raw.yaml
      - ./mixins/lidar_density.yaml
      - ./mixins/sky_logit.yaml
      - ./regularization/sharp_shape.yaml
      - ./regularization/lidar_density.yaml
      - ./strategy/eval3d_deformable.yaml
  - _import_:
      - ./smpl_raw.yaml
      - ./mixins/lidar_density.yaml
      - ./mixins/sky_logit.yaml
