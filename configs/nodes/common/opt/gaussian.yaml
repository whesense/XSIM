# Optimizer schedule shared by all gaussian nodes (feature- and strategy-agnostic).
params:
  positions:
    _fn_: xsim.modeling.nodes.sched_cfg
    lr_init: 1.6e-4
    lr_final: 1.6e-6
    scale_factor: 30.0
  scale:
    lr: 0.005
  rotation:
    lr: 0.001
  density:
    lr: 0.05
  features_albedo:
    lr: 2.5e-3
  features_specular:
    lr: 1.25e-4
